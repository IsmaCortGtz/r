<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Generator & Link Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles/new.css" />
  </head>
  <body class="min-h-screen bg-base-300 flex items-center justify-center p-4">

    <div class="card bg-base-100 shadow-2xl w-full max-w-2xl">
      <div class="card-body p-5 gap-0">

        <!-- Tabs toggle -->
        <div class="flex bg-base-200 rounded-xl p-1 mb-5">
          <button class="tab-btn flex-1 py-2.5 px-4 rounded-lg text-sm font-semibold transition-all bg-primary text-primary-content shadow" data-tab="qr">
            QR Generator
          </button>
          <button class="tab-btn flex-1 py-2.5 px-4 rounded-lg text-sm font-semibold transition-all text-base-content/50 hover:text-base-content" data-tab="shortener">
            Link Shortener
          </button>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- QR Generator Tab                                -->
        <!-- ═══════════════════════════════════════════════ -->
        <div id="tab-qr">
          <!-- Type selector - full width -->
          <div class="flex gap-1.5 overflow-x-auto pb-2 mb-4 -mx-1 px-1 type-scroll">
            <button class="type-btn active" data-type="url" title="URL / Link">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
              <span>Link</span>
            </button>
            <button class="type-btn" data-type="text" title="Plain Text">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span>Text</span>
            </button>
            <button class="type-btn" data-type="wifi" title="WiFi">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/></svg>
              <span>WiFi</span>
            </button>
            <button class="type-btn" data-type="email" title="Email">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              <span>Email</span>
            </button>
            <button class="type-btn" data-type="phone" title="Phone Call">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              <span>Call</span>
            </button>
            <button class="type-btn" data-type="sms" title="SMS">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
              <span>SMS</span>
            </button>
            <button class="type-btn" data-type="vcard" title="Contact / vCard">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span>Contact</span>
            </button>
          </div>

          <!-- Two-column layout: Information | Design -->
          <div class="flex flex-col md:flex-row gap-8">

            <!-- Left: Information -->
            <div class="flex-1 min-w-0">
              <h3 class="text-xs font-bold uppercase tracking-wider text-base-content/40 mb-3">Information</h3>

              <div class="space-y-2.5">
                <!-- URL form -->
                <div id="form-url" class="qr-form">
                  <input type="url" id="qr-url" placeholder="https://example.com" class="input input-bordered input-sm w-full" />
                  <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="qr-url-compress" class="checkbox checkbox-primary checkbox-xs" />
                    <span class="label-text text-xs cursor-pointer">Shorten URL</span>
                  </div>
                  <div id="qr-url-ratio" class="hidden text-xs mt-1.5 ml-6"></div>
                  <div id="qr-url-short" class="hidden text-xs text-primary mt-1 ml-6 break-all"></div>
                </div>

                <!-- Text form -->
                <div id="form-text" class="qr-form hidden">
                  <textarea id="qr-text" placeholder="Enter any text..." class="textarea textarea-bordered w-full text-sm" rows="3"></textarea>
                </div>

                <!-- WiFi form -->
                <div id="form-wifi" class="qr-form hidden space-y-2">
                  <input type="text" id="wifi-ssid" placeholder="Network name (SSID)" class="input input-bordered input-sm w-full" />
                  <input type="text" id="wifi-pass" placeholder="Password" class="input input-bordered input-sm w-full" />
                  <select id="wifi-enc" class="select select-bordered select-sm w-full">
                    <option value="WPA">WPA/WPA2</option>
                    <option value="WEP">WEP</option>
                    <option value="">None</option>
                  </select>
                </div>

                <!-- Email form -->
                <div id="form-email" class="qr-form hidden space-y-2">
                  <input type="email" id="email-to" placeholder="To (email@example.com)" class="input input-bordered input-sm w-full" />
                  <input type="text" id="email-subject" placeholder="Subject" class="input input-bordered input-sm w-full" />
                  <textarea id="email-body" placeholder="Message body" class="textarea textarea-bordered w-full text-sm" rows="2"></textarea>
                </div>

                <!-- Phone form -->
                <div id="form-phone" class="qr-form hidden">
                  <input type="tel" id="qr-phone" placeholder="+1 234 567 890" class="input input-bordered input-sm w-full" />
                </div>

                <!-- SMS form -->
                <div id="form-sms" class="qr-form hidden space-y-2">
                  <input type="tel" id="sms-phone" placeholder="+1 234 567 890" class="input input-bordered input-sm w-full" />
                  <textarea id="sms-body" placeholder="Message (optional)" class="textarea textarea-bordered w-full text-sm" rows="2"></textarea>
                </div>

                <!-- vCard form -->
                <div id="form-vcard" class="qr-form hidden space-y-2">
                  <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="vc-fname" placeholder="First name *" class="input input-bordered input-sm w-full" />
                    <input type="text" id="vc-lname" placeholder="Last name *" class="input input-bordered input-sm w-full" />
                  </div>
                  <input type="tel" id="vc-phone" placeholder="Phone" class="input input-bordered input-sm w-full" />
                  <input type="email" id="vc-email" placeholder="Email" class="input input-bordered input-sm w-full" />
                  <input type="text" id="vc-org" placeholder="Company" class="input input-bordered input-sm w-full" />
                  <input type="text" id="vc-title" placeholder="Job title" class="input input-bordered input-sm w-full" />
                  <input type="text" id="vc-address" placeholder="Address" class="input input-bordered input-sm w-full" />
                  <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="vc-city" placeholder="City" class="input input-bordered input-sm w-full" />
                    <input type="text" id="vc-postcode" placeholder="Post code" class="input input-bordered input-sm w-full" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="vc-country" placeholder="Country" class="input input-bordered input-sm w-full" />
                    <input type="url" id="vc-url" placeholder="Website" class="input input-bordered input-sm w-full" />
                  </div>
                </div>
              </div>
            </div>

            <!-- Right: Design -->
            <div class="flex-1 min-w-0">
              <h3 class="text-xs font-bold uppercase tracking-wider text-base-content/40 mb-3">Design</h3>

              <!-- Colors -->
              <div class="flex gap-4 items-center justify-center mb-4">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="color" id="color-dark" value="#000000" class="color-input" />
                  <span class="text-xs text-base-content/50">Foreground</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="color" id="color-light" value="#ffffff" class="color-input" />
                  <span class="text-xs text-base-content/50">Background</span>
                </label>
              </div>

              <!-- Module Style -->
              <div class="flex gap-2 justify-center mb-2">
                <button class="module-style-btn active" data-style="square" title="Square">
                  <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>
                  <span class="text-[0.6rem]">Square</span>
                </button>
                <button class="module-style-btn" data-style="rounded" title="Rounded">
                  <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="2.5"/><rect x="11" y="2" width="7" height="7" rx="2.5"/><rect x="2" y="11" width="7" height="7" rx="2.5"/><rect x="11" y="11" width="7" height="7" rx="2.5"/></svg>
                  <span class="text-[0.6rem]">Rounded</span>
                </button>
                <button class="module-style-btn" data-style="dots" title="Dots">
                  <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><circle cx="5.5" cy="5.5" r="3.5"/><circle cx="14.5" cy="5.5" r="3.5"/><circle cx="5.5" cy="14.5" r="3.5"/><circle cx="14.5" cy="14.5" r="3.5"/></svg>
                  <span class="text-[0.6rem]">Dots</span>
                </button>
              </div>
              <!-- Corner radius (visible only for rounded) -->
              <div id="radius-control" class="hidden flex items-center gap-2 justify-center mb-4">
                <span class="text-xs text-base-content/40">Radius</span>
                <input type="range" id="corner-radius" min="0" max="50" value="35" class="range range-xs range-primary w-24" />
                <span id="radius-value" class="text-xs text-base-content/40 w-6 text-right">35</span>
              </div>

              <!-- Logo -->
              <div class="mb-4">
                <div class="flex gap-2 items-center justify-center">
                  <label for="logo-upload" class="btn btn-outline btn-xs gap-1 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Add logo
                  </label>
                  <button id="logo-remove" class="btn btn-ghost btn-xs text-error hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    Remove
                  </button>
                </div>
                <input type="file" id="logo-upload" accept="image/*" class="hidden" />
                <div id="logo-position" class="hidden flex gap-2 justify-center mt-2">
                  <label class="flex items-center gap-1 cursor-pointer text-xs text-base-content/50">
                    <input type="radio" name="logo-pos" value="center" class="radio radio-xs radio-primary" checked /> Center
                  </label>
                  <label class="flex items-center gap-1 cursor-pointer text-xs text-base-content/50">
                    <input type="radio" name="logo-pos" value="bottom-right" class="radio radio-xs radio-primary" /> Bottom-right
                  </label>
                </div>
              </div>

              <!-- QR Preview -->
              <div class="flex justify-center bg-white rounded-xl p-5 mb-3 shadow-inner">
                <div id="qr-output" class="qr-preview">
                  <span class="text-base-content/20 text-sm">Select type and fill fields</span>
                </div>
              </div>

              <!-- Download -->
              <div class="flex justify-center">
                <button id="download-btn" class="btn btn-primary btn-sm gap-2" disabled>
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                  Download SVG
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- Link Shortener Tab                              -->
        <!-- ═══════════════════════════════════════════════ -->
        <div id="tab-shortener" class="hidden">
          <div class="form-control w-full mb-4">
            <input type="url" id="short-input" placeholder="Paste your long URL here..." class="input input-bordered w-full" />
          </div>

          <div id="short-result" class="bg-base-200 rounded-xl p-4 min-h-[80px]">
            <div id="short-output" class="text-sm text-base-content/40">Enter a URL above to shorten it</div>
            <div id="short-ratio" class="hidden text-xs mt-2"></div>
          </div>
        </div>

      </div>
    </div>

    <script type="module" src="./pages/new.ts"></script>
  </body>
</html>
